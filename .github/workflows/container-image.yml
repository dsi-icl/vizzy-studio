name: Container Image (OCI)

on:
    push:
        branches:
            - main
            - integration/main-serve-demos-font-20261027
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            include_sourcemaps:
                description: Keep JS sourcemaps in the container image for debugging
                required: false
                default: false
                type: boolean

permissions:
    contents: read
    packages: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: 'true'

concurrency:
    group: container-image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Normalize image owner
              id: prep
              run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

            - name: Build metadata
              id: meta
              run: |
                  echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
                  if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                    echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                  elif [[ "${GITHUB_REF}" == "refs/heads/integration/main-serve-demos-font-20261027" ]]; then
                    echo "version=dev-sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                  else
                    echo "version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                  fi
                  case "${GITHUB_REF}" in
                    refs/heads/main)
                      echo "tags=sha-${GITHUB_SHA} latest" >> "$GITHUB_OUTPUT"
                      ;;
                    refs/heads/integration/main-serve-demos-font-20261027)
                      echo "tags=sha-${GITHUB_SHA} dev-sha-${GITHUB_SHA} dev" >> "$GITHUB_OUTPUT"
                      ;;
                    refs/tags/v*)
                      echo "tags=sha-${GITHUB_SHA} ${GITHUB_REF_NAME} latest" >> "$GITHUB_OUTPUT"
                      ;;
                    *)
                      echo "tags=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                      ;;
                  esac

            - name: Resolve sourcemap mode
              id: sourcemaps
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.include_sourcemaps }}" == "true" ]]; then
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push production image
              shell: bash
              env:
                  IMAGE: ghcr.io/${{ steps.prep.outputs.owner_lc }}/vizzy-studio
                  TAGS: ${{ steps.meta.outputs.tags }}
                  OCI_CREATED: ${{ steps.meta.outputs.created }}
                  OCI_VERSION: ${{ steps.meta.outputs.version }}
                  BUILD_SOURCEMAPS: ${{ steps.sourcemaps.outputs.enabled }}
              run: |
                  set -euo pipefail
                  read -r -a tags <<< "$TAGS"
                  tag_args=()
                  for tag in "${tags[@]}"; do
                    tag_args+=(--tag "${IMAGE}:${tag}")
                  done
                  git archive --format=tar "$GITHUB_SHA" | docker buildx build \
                    --platform linux/amd64 --target production --push \
                    "${tag_args[@]}" \
                    --build-arg "OCI_CREATED=${OCI_CREATED}" \
                    --build-arg "OCI_VERSION=${OCI_VERSION}" \
                    --build-arg "OCI_REVISION=${GITHUB_SHA}" \
                    --build-arg "OCI_SOURCE=https://github.com/${GITHUB_REPOSITORY}" \
                    --build-arg "BUILD_SOURCEMAPS=${BUILD_SOURCEMAPS}" \
                    --build-arg "KEEP_SOURCE_MAPS=${BUILD_SOURCEMAPS}" \
                    --build-arg "VITE_GIT_SHA=${GITHUB_SHA}" \
                    --build-arg "APP_COMMIT_SHA=${GITHUB_SHA}" -
