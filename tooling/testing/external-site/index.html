<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>External capture fixture</title>
        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
            }

            main {
                position: relative;
                display: grid;
                width: 100%;
                height: 100%;
                grid-template: 1fr 1fr / 1fr 1fr;
                font-family: Arial, sans-serif;
            }

            .navy {
                background: #0f172a;
            }

            .blue {
                background: #0369a1;
            }

            .violet {
                background: #7c3aed;
            }

            .amber {
                background: #f59e0b;
            }

            .marker {
                position: absolute;
                top: 50%;
                left: 50%;
                min-width: 270px;
                padding: 18px 24px;
                transform: translate(-50%, -50%);
                border: 4px solid #ffffff;
                border-radius: 14px;
                background: #111827;
                color: #ffffff;
                text-align: center;
                box-shadow: 0 12px 36px rgb(0 0 0 / 35%);
            }

            h1,
            p {
                margin: 0;
            }

            h1 {
                font-size: 28px;
            }

            p {
                margin-top: 6px;
                color: #bae6fd;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="navy"></div>
            <div class="blue"></div>
            <div class="violet"></div>
            <div class="amber"></div>
            <section class="marker">
                <h1>External capture</h1>
                <p>deterministic cross-origin fixture</p>
            </section>
        </main>
    </body>
</html>
